{% extends 'main.html' %}

{% block title %}Start{% endblock %}

{% block body %}
<div class="container bg-light-subtle p-lg-5 border border-5 border-dark " style="margin-top: 10%">
  <div class="row">
    <div class="col">
    <h1 class="col">Welcome!</h1>


  <h2>Scan Your Telegram QR code to begin</h2>

  {% for message in get_flashed_messages() %}
  <div class="alert alert-warning fs-5" role="alert">{{ message }}</div>
  {% endfor %}

  <div id="scan-status" class="alert alert-info fs-5" role="status" hidden></div>

  <a href="{{ url_for('custom') }}" class="btn btn-lg btn-primary">Custom Enrollment</a>
  <a href="#" class="btn btn-lg btn-success">Check-in</a>
  <a href="#" class="btn btn-lg btn-dark">Check-out</a>

  <div class="mt-3">{% include '_autoprint.html' %}</div>

  <script src="{{ url_for('static', filename='js/client-connection.js') }}"></script>
  <script>
    // An ID scanned before the Telegram QR is held until the QR arrives.
    function showPendingId(age) {
      const status = document.getElementById("scan-status");
      status.classList.replace("alert-danger", "alert-info");
      status.textContent = `ID scanned (age ${age}). Now scan the guest's Telegram QR code.`;
      status.hidden = false;
    }
    document.addEventListener("DOMContentLoaded", () => {
      const age = peekPendingAge();
      if (age !== null) showPendingId(age);
    });
    document.addEventListener("idscanned", (event) => showPendingId(event.detail.age));
    document.addEventListener("idscanfailed", (event) => {
      const status = document.getElementById("scan-status");
      status.textContent = event.detail.message;
      status.classList.replace("alert-info", "alert-danger");
      status.hidden = false;
    });
  </script>
      </div>
  <div class="col">
    <img class="col img-fluid w-50 " src="static/resources/img/clipart_sciencemedicine_022.gif">
  </div>
     </div>
</div>
{% endblock %}
